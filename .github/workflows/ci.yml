name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow's own GitHub token: read the code, nothing else
permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (no backend, no AWS access needed)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  checkov:
    name: Checkov IaC security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true

  container:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t platform-lab:ci ./app

      # Pinned to a commit SHA, not a tag: tags can be moved by an attacker, SHAs cannot
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-lab:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  shellcheck:
    name: ShellCheck Bash scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint scripts
        run: shellcheck scripts/*.sh